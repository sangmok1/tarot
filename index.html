<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07041a">
<title>달빛 타로</title>

window.GA_ID = '';
window.track = function(){};
if (window.GA_ID) {
  var s = document.createElement('script'); s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + window.GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07041a; --bg2:#140a33;
  --gold:#e9c97c; --gold-hi:#fff1c4; --gold-lo:#a8762c;
  --violet:#8b5cf6; --text:#f1e9ff; --muted:#a89bc8;
  --serif:'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
  --display:'Cinzel', 'Nanum Myeongjo', serif;
  --fw:clamp(38px, 10.4vw, 74px);         /* 펼친 덱 카드 폭 */
  --sw:clamp(86px, 27vw, 170px);          /* 선택 슬롯 카드 폭 */
  --back:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, #2a1563 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 85% 85%, #3a0f4f 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 10% 70%, #0f1f55 0%, transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-family:var(--serif);
  overflow-x:hidden; min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;align-items:center}

/* ---------- 타로 마스터 ---------- */
#top{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;transition:all .6s}
.master-wrap{position:relative;width:min(54vw,270px);aspect-ratio:240/270;transition:width .8s cubic-bezier(.2,.8,.2,1);flex-shrink:0}
.master{position:absolute;inset:0;animation:float 6s ease-in-out infinite}
.master svg{width:100%;height:100%;overflow:visible}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.orbit{position:absolute;inset:-8%;border-radius:50%;animation:spin 28s linear infinite;pointer-events:none}
.orbit span{position:absolute;left:50%;top:50%;color:var(--gold);font-size:clamp(8px,2.4vw,14px);text-shadow:0 0 8px var(--gold);opacity:.8}
.orbit.o2{inset:4%;animation-duration:19s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.eyes{animation:blink 5s infinite;transform-origin:120px 102px}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.orb-swirl{transform-origin:120px 205px;animation:spin 7s linear infinite}
.orb-pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.speech{
  font-size:clamp(14px,3.9vw,17px);line-height:1.7;text-align:center;white-space:pre-line;
  color:var(--text);min-height:3.4em;max-width:30em;text-shadow:0 0 14px rgba(160,120,255,.6);
}
.speech .cursor{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:pulse 1s infinite}

body:not([data-phase=intro]) #top{flex-direction:row;justify-content:center;gap:12px;min-height:90px}
body:not([data-phase=intro]) .master-wrap{width:78px}
body:not([data-phase=intro]) .orbit{display:none}
body:not([data-phase=intro]) .speech{
  text-align:left;background:rgba(30,16,70,.55);border:1px solid rgba(233,201,124,.25);
  padding:10px 14px;border-radius:14px 14px 14px 4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  min-height:auto;font-size:clamp(13px,3.6vw,16px);flex:1;max-width:520px
}

/* ---------- 인트로 ---------- */
#intro{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:460px;margin-top:4px}
h1{font-family:var(--display);font-weight:600;letter-spacing:.18em;margin:0;font-size:clamp(26px,7.6vw,40px);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 12px rgba(233,201,124,.35))}
.sub{margin:-12px 0 0;color:var(--muted);font-size:13px;letter-spacing:.3em;font-family:var(--display)}
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.topic{
  font:inherit;color:var(--text);background:rgba(28,14,64,.6);border:1px solid rgba(233,201,124,.22);border-radius:14px;
  padding:12px 6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.25s
}
.topic b{font-size:15px}
.topic small{font-size:11px;color:var(--muted)}
.topic .ic{font-size:18px;color:var(--gold)}
.topic[aria-pressed=true]{border-color:var(--gold);background:rgba(80,40,150,.55);box-shadow:0 0 18px rgba(233,201,124,.3), inset 0 0 18px rgba(233,201,124,.12)}
.q{width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(10,5,30,.6);border:1px solid rgba(233,201,124,.25);
  border-radius:12px;padding:13px 14px;outline:none;text-align:center}
.q::placeholder{color:#7d70a3}
.q:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(233,201,124,.15)}
/* 신비로운 버튼: 반투명 보라 + 금테 + 별 장식 + 빛이 스치는 효과 */
.btn{
  position:relative;overflow:hidden;cursor:pointer;
  font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.18em;color:var(--gold-hi);
  background:linear-gradient(180deg,rgba(70,36,140,.55),rgba(22,10,54,.75));
  border:1px solid rgba(233,201,124,.65);border-radius:10px;padding:14px 34px;
  box-shadow:0 0 18px rgba(139,92,246,.35),inset 0 0 14px rgba(233,201,124,.12);
  text-shadow:0 0 10px rgba(233,201,124,.6);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:transform .2s, box-shadow .3s;animation:btnGlow 3s ease-in-out infinite
}
.btn::before{content:"✦";margin-right:.7em;font-size:.8em;color:var(--gold)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.28) 50%,transparent 65%);
  transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
@keyframes btnGlow{0%,100%{box-shadow:0 0 14px rgba(139,92,246,.3),inset 0 0 12px rgba(233,201,124,.1)}50%{box-shadow:0 0 28px rgba(167,139,250,.55),inset 0 0 18px rgba(233,201,124,.2)}}
.btn:active{transform:scale(.96)}
@media(hover:hover){.btn:hover{border-color:var(--gold);box-shadow:0 0 34px rgba(233,201,124,.45),inset 0 0 18px rgba(233,201,124,.25)}}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(233,201,124,.5);box-shadow:none}

/* ---------- 스테이지 ---------- */
#stage{width:100%;display:none;flex-direction:column;align-items:center;gap:10px;margin-top:8px}
body:not([data-phase=intro]) #stage{display:flex}
body:not([data-phase=intro]) #intro{display:none}

#slots{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);transition:opacity .6s, transform .6s;width:100%}
body[data-phase=shuffle] #slots{opacity:0;transform:translateY(-10px);pointer-events:none}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;width:var(--sw)}
.slot.single{width:calc(var(--sw)*1.25)}
.slot .lbl{font-size:clamp(11px,3.2vw,14px);color:var(--gold);letter-spacing:.08em;white-space:nowrap}
.flip{position:relative;width:100%;aspect-ratio:100/172;perspective:900px}
.flip::before{content:"";position:absolute;inset:0;border-radius:7%/4.3%;border:1px dashed rgba(233,201,124,.35);
  background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.18),transparent 70%)}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.slot.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:7%/4.3%;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{background:var(--back) center/100% 100%;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 14px rgba(233,201,124,.2)}
.face.front{transform:rotateY(180deg)}
.slot:not(.filled) .face{opacity:0}
.slot.filled .flip::before{display:none}
.slot.flipped .face.front{box-shadow:0 0 30px rgba(233,201,124,.45),0 8px 24px rgba(0,0,0,.6)}
.slot .nm{font-size:clamp(12px,3.4vw,15px);font-weight:700;text-align:center;opacity:0;transform:translateY(6px);transition:.6s .5s;min-height:1.4em}
.slot.flipped .nm{opacity:1;transform:none}
.slot .nm em{display:block;font-style:normal;font-weight:400;font-size:.82em;color:var(--muted)}

/* 카드 앞면 */
.cf{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(160deg,#3a2378,#140a33 55%,#2b1460)}
.cf::before{content:"";position:absolute;inset:2.2%;border:1px solid var(--gold);border-radius:5%/3%;opacity:.95;pointer-events:none;z-index:2}
.cf .pic{position:absolute;inset:4.5% 5%;overflow:hidden;border-radius:3%/1.8%;
  box-shadow:0 0 0 1px rgba(233,201,124,.55)}
.cf.rev .pic{transform:rotate(180deg)}
.cf img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.09,1.06);
  filter:sepia(.12) saturate(1.08) contrast(1.04);user-select:none;-webkit-user-drag:none}
.cf .pic::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(90,40,170,.22),transparent 35%,transparent 70%,rgba(30,10,70,.35));
  box-shadow:inset 0 0 22px rgba(25,8,60,.55)}
.cf .shine{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.35) 45%,transparent 60%);
  transform:translateX(-120%)}
.slot.flipped .cf .shine{animation:shine 1.4s .9s ease-out both}
@keyframes shine{to{transform:translateX(120%)}}

/* 덱 */
.hint{font-size:13px;color:var(--muted);letter-spacing:.05em;min-height:1.3em;text-align:center;transition:opacity .4s}
.hint b{color:var(--gold)}
.deck{position:relative;width:100%;height:calc(var(--fw)*4.4 + 16px);transition:opacity .7s, transform .7s}
.deck.gone{opacity:0;transform:translateY(30px);pointer-events:none}
body[data-phase=reveal] .deck, body[data-phase=reveal] .hint,
body[data-phase=result] .deck, body[data-phase=result] .hint{display:none}
#slots.leave{opacity:0;transform:scale(.94);transition:opacity .5s, transform .5s}
body[data-phase=result] #slots{display:none}
.dcard{
  position:absolute;left:50%;top:calc(var(--fw)*.5);width:var(--fw);height:calc(var(--fw)*1.72);margin-left:calc(var(--fw)/-2);
  transform-origin:50% calc(var(--fw)*5);
  transform:translate(var(--sx,0px),var(--sy,0px)) rotate(var(--sr,0deg));
  transition:transform .9s cubic-bezier(.2,.8,.2,1) var(--d,0ms), opacity .35s, filter .3s;
  background:var(--back) center/100% 100%;border-radius:7%/4.3%;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.55);
}
.deck.fanned .dcard{transform:rotate(var(--a)) translateY(var(--lift,0px))}
@media(hover:hover){.deck.ready .dcard:hover{--lift:calc(var(--fw)*-.35);filter:brightness(1.25) drop-shadow(0 0 8px var(--gold))}}
.deck.ready .dcard:active{--lift:calc(var(--fw)*-.35)}
.dcard.taken{opacity:0;pointer-events:none}
.deck.done .dcard{pointer-events:none;filter:brightness(.6)}
.fly{position:fixed;z-index:50;background:var(--back) center/100% 100%;border-radius:7%/4.3%;pointer-events:none;
  box-shadow:0 0 30px rgba(233,201,124,.6),0 10px 30px rgba(0,0,0,.6)}

.deck.shuffling .dcard{transition:transform .42s cubic-bezier(.3,.7,.2,1) var(--d,0ms)}

/* 인트로 덱(누르면 셔플 시작) */
.altar{position:relative;width:min(56vw,220px);aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;margin-top:4px}
.altar .ring{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.altar .r1{border:1px dashed rgba(233,201,124,.55);animation:spin 30s linear infinite}
.altar .r2{inset:9%;border:1px solid rgba(233,201,124,.35);animation:spin 18s linear infinite reverse}
.altar .r2::before,.altar .r2::after{content:"✦";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);color:var(--gold);font-size:12px;text-shadow:0 0 8px var(--gold)}
.altar .r2::after{top:auto;bottom:-.62em}
.altar .glow{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.55),rgba(124,58,237,.15) 55%,transparent 70%);animation:pulse 3s ease-in-out infinite}
.altar .stack{position:relative;width:34%;aspect-ratio:100/172}
.altar .stack i{position:absolute;inset:0;background:var(--back) center/100% 100%;border-radius:7%/4.3%;
  box-shadow:0 4px 14px rgba(0,0,0,.6);transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.altar .stack i:nth-child(1){transform:rotate(-9deg) translateX(-14%)}
.altar .stack i:nth-child(2){transform:rotate(-3deg) translateX(-4%)}
.altar .stack i:nth-child(3){transform:rotate(4deg) translateX(6%)}
.altar .stack i:nth-child(4){transform:rotate(0deg);animation:hover 3s ease-in-out infinite;box-shadow:0 0 18px rgba(233,201,124,.45),0 6px 16px rgba(0,0,0,.6)}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@media(hover:hover){
  .altar:hover .stack i:nth-child(1){transform:rotate(-20deg) translateX(-40%)}
  .altar:hover .stack i:nth-child(2){transform:rotate(-8deg) translateX(-16%)}
  .altar:hover .stack i:nth-child(3){transform:rotate(9deg) translateX(20%)}
}
.altar.go .stack i:nth-child(1){transform:translate(-160%,-20%) rotate(-30deg)}
.altar.go .stack i:nth-child(2){transform:translate(-70%,-50%) rotate(-12deg)}
.altar.go .stack i:nth-child(3){transform:translate(160%,-20%) rotate(28deg)}
.altar.go .stack i:nth-child(4){transform:translate(60%,-60%) rotate(14deg);animation:none}
.altar.go{transition:opacity .5s .2s;opacity:0}
.altar-cap{margin:-4px 0 0;font-size:14px;color:var(--muted);letter-spacing:.04em;text-align:center;animation:pulse 2.6s ease-in-out infinite}
.altar-cap b{color:var(--gold);font-weight:700}

#revealBtn{display:none;margin-top:6px}
#revealBtn.show{display:inline-block;animation:rise .6s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- 해석 ---------- */
#reading{display:none;width:100%;max-width:640px;margin-top:22px;flex-direction:column;gap:14px}
#reading.show{display:flex;animation:rise .8s both}
.r-q{text-align:center;color:var(--muted);font-size:14px}
.r-q b{color:var(--text);font-weight:700}
.r-item{display:flex;gap:14px;padding:16px;border-radius:16px;background:rgba(24,12,58,.62);border:1px solid rgba(233,201,124,.2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:rise .7s both}
.r-card{position:relative;width:clamp(70px,20vw,96px);aspect-ratio:100/172;flex-shrink:0;align-self:flex-start;border-radius:7%/4.3%;overflow:hidden;box-shadow:0 0 16px rgba(233,201,124,.3)}
.r-body{flex:1;min-width:0}
.r-pos{font-size:12px;color:var(--gold);letter-spacing:.12em}
.r-body h3{margin:4px 0 8px;font-size:18px;line-height:1.35}
.ori{display:inline-block;font-size:11px;font-weight:400;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:2px;border:1px solid}
.ori.up{color:#ffe7a8;border-color:rgba(255,231,168,.5)}
.ori.dn{color:#c9b5ff;border-color:rgba(201,181,255,.5)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chips span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(139,92,246,.22);color:#e3d6ff}
.r-body p{margin:0;font-size:14.5px;line-height:1.75;color:#e9e0ff}
.r-body p.adv{margin-top:8px;color:var(--gold-hi);font-size:13.5px}
.summary{padding:20px 18px;border-radius:18px;text-align:center;line-height:1.85;font-size:15px;
  background:linear-gradient(180deg,rgba(80,40,150,.45),rgba(24,12,58,.6));border:1px solid rgba(233,201,124,.4);box-shadow:0 0 30px rgba(139,92,246,.25)}
.summary h4{margin:0 0 8px;font-family:var(--display);color:var(--gold);letter-spacing:.2em;font-size:14px}
.summary p{margin:0 0 8px}
.note{text-align:center;font-size:12px;color:var(--muted);margin:2px 0 0}
.actions{display:flex;justify-content:center;gap:10px;margin-top:6px}
.r-list{display:flex;flex-direction:column;gap:14px}

/* 큰 화면: 3장 해석을 나란히 */
@media (min-width:900px){
  #reading.three{max-width:1120px}
  .r-list.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
  .r-list.three .r-item{flex-direction:column;align-items:center;padding:22px 20px}
  .r-list.three .r-card{width:170px;align-self:center}
  .r-list.three .r-pos,.r-list.three h3{text-align:center}
  .r-list.three .chips{justify-content:center}
  #reading.three .summary,#reading.three .r-q{max-width:760px;margin-left:auto;margin-right:auto;width:100%}
  .r-list:not(.three) .r-card{width:140px}
}

@media (min-width:700px){ main{padding-top:24px} }
@media (prefers-reduced-motion:reduce){.master,.orbit,.orb-swirl{animation:none}}
</style>
</head>
<body data-phase="intro">
<canvas id="sky"></canvas>


<main>
  <header id="top">
    <div class="master-wrap">
      <div class="orbit" id="orbit1"></div>
      <div class="orbit o2" id="orbit2"></div>
      <div class="master">
        <svg viewBox="0 0 240 270" aria-label="타로 마스터">
          <defs>
            <radialGradient id="halo" cx=".5" cy=".45" r=".5">
              <stop offset="0" stop-color="#a78bfa" stop-opacity=".55"/>
              <stop offset=".6" stop-color="#6d28d9" stop-opacity=".18"/>
              <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="cloak" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a2890"/><stop offset=".55" stop-color="#25124f"/><stop offset="1" stop-color="#0e0626"/>
            </linearGradient>
            <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a1f74"/><stop offset="1" stop-color="#1a0c3a"/>
            </linearGradient>
            <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff3cc"/><stop offset=".5" stop-color="#e9c97c"/><stop offset="1" stop-color="#a8762c"/>
            </linearGradient>
            <radialGradient id="orb" cx=".38" cy=".35" r=".7">
              <stop offset="0" stop-color="#ffffff"/><stop offset=".22" stop-color="#d8ccff"/>
              <stop offset=".6" stop-color="#7c3aed"/><stop offset="1" stop-color="#1e1048"/>
            </radialGradient>
            <radialGradient id="orbGlow" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#c4b5fd" stop-opacity=".9"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
            </radialGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="orbClip"><circle cx="120" cy="205" r="29"/></clipPath>
          </defs>
          <circle cx="120" cy="125" r="122" fill="url(#halo)"/>
          <circle cx="120" cy="96" r="78" fill="none" stroke="url(#mg)" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="2 5"/>
          <circle cx="120" cy="96" r="88" fill="none" stroke="url(#mg)" stroke-opacity=".18" stroke-width=".6"/>

}

</defs>

${s4(59,82.5,3.4)}${s4(50,24,5)}${s4(50,141,5)}${s4(38,28,1.8)}${s4(62,28,1.8)}${s4(38,137,1.8)}${s4(62,137,1.8)}
${s4(14,15,3.2)}${s4(86,15,3.2)}${s4(14,150,3.2)}${s4(86,150,3.2)}
${dots}
</g>
</svg>`;
}

/* 오빗 장식 */
['orbit1','orbit2'].forEach((id,k)=>{const o=document.getElementById(id);const n=k?5:8;const ch=k?'✧':'✦';

/* ================= 상태 · 유틸 ================= */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r=>setTimeout(r,ms));
const body = document.body, deck=$('#deck'), slotsEl=$('#slots'), hint=$('#hint'), reading=$('#reading'), revealBtn=$('#revealBtn');
const state = {topic:'love', picked:[], order:[], question:''};
const shuffle = a => {for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let sayToken=0;
async function say(text){
  const el=$('#speech'); const t=++sayToken; el.textContent='';
  const cur=document.createElement('span');cur.className='cursor';
  const tx=document.createTextNode('');el.append(tx,cur);
  for(const ch of text){ if(t!==sayToken) return; tx.data+=ch; await wait(ch==='\n'?220:38); }
  if(t===sayToken) setTimeout(()=>{ if(t===sayToken) cur.remove(); },1500);
}

/* ================= 인트로 ================= */
function selectTopic(t){
  state.topic=t;
  document.querySelectorAll('.topic').forEach(x=>x.setAttribute('aria-pressed', x.dataset.topic===t));
}
let topicTouched=false;
document.querySelectorAll('.topic').forEach(b=>b.addEventListener('click',()=>{ topicTouched=true; $('#question').value=''; selectTopic(b.dataset.topic); }));

/* 질문 내용으로 주제 추정: 사용자가 주제를 직접 고르지 않았을 때만 자동으로 맞춰줌 */
const LOVE_RE=/사랑|연애|애인|남친|여친|남자친구|여자친구|그\s?사람|그\s?남자|그\s?여자|그\s?애|썸|짝사랑|재회|헤어|이별|고백|결혼|인연|상대|마음을|좋아하|속마음|커플|소개팅|전남친|전여친|배우자|궁합/;
const TODAY_RE=/오늘|하루|이번\s?주|내일/;
function inferTopic(q){
  if(!q) return null;
  if(LOVE_RE.test(q)) return 'love';
  if(TODAY_RE.test(q)) return 'today';
  return 'worry';
}
$('#question').addEventListener('input', e=>{
  if(topicTouched) return;
  const t=inferTopic(e.target.value.trim());
  selectTopic(t||'love');
});
$('#startBtn').addEventListener('click', start);
$('#question').addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });

function intro(){
  body.dataset.phase='intro';
  say('어서 오세요, 별을 따라 찾아온 이여…\n오늘은 무엇이 궁금한가요?');
}

/* ================= 진행 ================= */
let running=false;
async function start(){
  if(running) return; running=true;
  $('#question').blur();
  const altar=$('#startBtn'); altar.classList.add('go');
  if(navigator.vibrate) navigator.vibrate(20);
  await wait(650);
  altar.classList.remove('go');
  state.question=$('#question').value.trim();
  if(!topicTouched && state.question) selectTopic(inferTopic(state.question));
  track('start_reading',{topic:state.topic, has_question:!!state.question});
  $('#question').value=''; topicTouched=false;
  const T=TOPICS[state.topic];
  state.picked=[]; state.order=shuffle([...Array(22).keys()]);
  reading.className=''; reading.innerHTML=''; revealBtn.classList.remove('show');
  buildSlots(T); buildDeck();
  body.dataset.phase='shuffle';
  window.scrollTo({top:0,behavior:'smooth'});
  hint.innerHTML='';
  say('카드에 당신의 기운을 불어넣고 있어요…\n숨을 고르고, 마음을 가라앉혀 보세요.');
  await wait(600);
  await shuffleAnim();
  say('운명의 카드가 펼쳐집니다…');
  await wait(300);
  await fanOut();
  body.dataset.phase='pick';
  say(T.prompt);
  updateHint();
  running=false;
}

function buildSlots(T){
  slotsEl.innerHTML='';
  T.pos.forEach(p=>{
    const s=document.createElement('div');
    s.className='slot'+(T.need===1?' single':'');
    s.innerHTML=`<div class="lbl">${p}</div><div class="flip"><div class="flip-in"><div class="face back"></div><div class="face front"></div></div></div><div class="nm"></div>`;
    slotsEl.appendChild(s);
  });
}

function buildDeck(){
  deck.className='deck'; deck.innerHTML='';
  for(let i=0;i<22;i++){
    const c=document.createElement('div');
    c.className='dcard'; c.dataset.i=i;
    c.setAttribute('role','button'); c.setAttribute('aria-label',`${i+1}번째 카드`);
    c.style.setProperty('--sx',(Math.random()*6-3).toFixed(1)+'px');
    c.style.setProperty('--sr',(Math.random()*2-1).toFixed(2)+'deg');
    c.style.zIndex=i;
    c.addEventListener('click',pick);
    deck.appendChild(c);
  }
}

function fw(){ return deck.firstElementChild.getBoundingClientRect().width; }

/* 리플 셔플: 덱을 반으로 갈라 좌우로 벌린 뒤, 한 장씩 엇갈리게 합치기 × 3회 */
async function shuffleAnim(){
  const w=fw(); deck.classList.add('shuffling');
  let order=[...deck.children]; const n=order.length, h=n/2;
  const set=(c,x,y,r,d)=>{c.style.setProperty('--d',d+'ms');c.style.setProperty('--sx',x+'px');c.style.setProperty('--sy',y+'px');c.style.setProperty('--sr',r+'deg');};
  for(let round=0;round<3;round++){
    // 1) 반으로 나눠 양옆으로
    order.forEach((c,i)=>{const L=i<h, k=L?i:i-h; set(c,(L?-1:1)*w*1.2,-k*.8,(L?-8:8),0)});
    await wait(460);
    // 2) 양쪽에서 한 장씩 떨어뜨리며 합치기
    const Ls=order.slice(0,h), Rs=order.slice(h), merged=[];
    for(let k=0;k<h;k++) Math.random()<.5 ? merged.push(Ls[k],Rs[k]) : merged.push(Rs[k],Ls[k]);
    merged.forEach((c,k)=>{c.style.zIndex=k; set(c,(Math.random()*4-2).toFixed(1),(-k*.5).toFixed(1),(Math.random()*2-1).toFixed(2),k*20)});
    if(navigator.vibrate) navigator.vibrate([8,30,8,30,8]);
    await wait(420+n*20);
    order=merged;
  }
  // DOM 순서를 섞인 순서로 정리
  order.forEach(c=>deck.appendChild(c));
  deck.classList.remove('shuffling');
}

async function fanOut(){
  const cards=[...deck.children]; const n=cards.length;
  const maxA = window.innerWidth<560 ? 50 : 44;
  cards.forEach((c,i)=>{
    c.style.zIndex=i;
    c.style.setProperty('--a',(-maxA+2*maxA*i/(n-1)).toFixed(2)+'deg');
    c.style.setProperty('--d',(i*30)+'ms');
  });
  deck.classList.add('fanned');
  await wait(900+n*30);
  cards.forEach(c=>c.style.setProperty('--d','0ms'));
  deck.classList.add('ready');
}

function updateHint(){
  const T=TOPICS[state.topic]; const k=state.picked.length;
  hint.innerHTML = k<T.need ? `<b>${k}</b> / ${T.need} 장 선택됨 · 카드를 눌러 뽑아주세요` : '';
}

function pick(e){
  const c=e.currentTarget, T=TOPICS[state.topic];
  if(body.dataset.phase!=='pick'||!deck.classList.contains('ready')||c.classList.contains('taken')||state.picked.length>=T.need) return;
  const k=state.picked.length;
  const card=state.order[+c.dataset.i], rev=Math.random()<0.3;
  state.picked.push({card,rev});
  new Image().src=imgSrc(card);   // 뒤집기 전에 미리 로드
  const slot=slotsEl.children[k];
  slot.querySelector('.face.front').innerHTML=frontHTML(card,rev);
  slot.querySelector('.nm').innerHTML=`${CARDS[card].ko}<em>${rev?'역방향':'정방향'}</em>`;

  const from=c.getBoundingClientRect();
  const to=slot.querySelector('.flip').getBoundingClientRect();
  const a=parseFloat(c.style.getPropertyValue('--a'))||0;
  c.classList.add('taken');
  if(navigator.vibrate) navigator.vibrate(15);

  const fly=document.createElement('div'); fly.className='fly';
  Object.assign(fly.style,{left:to.left+'px',top:to.top+'px',width:to.width+'px',height:to.height+'px'});
  document.body.appendChild(fly);
  const s=fw()/to.width;
  const dx=(from.left+from.width/2)-(to.left+to.width/2), dy=(from.top+from.height/2)-(to.top+to.height/2);
  fly.animate([
    {transform:`translate(${dx}px,${dy}px) rotate(${a}deg) scale(${s})`},
    {transform:`translate(${dx*.35}px,${dy*.45-30}px) rotate(${a*.2}deg) scale(${(s+1)/2*1.12})`,offset:.55},
    {transform:'none'}
  ],{duration:780,easing:'cubic-bezier(.3,.7,.2,1)'}).onfinish=()=>{ slot.classList.add('filled'); fly.remove(); };

  updateHint();
  track('pick_card',{topic:state.topic, order:state.picked.length});
  if(state.picked.length===T.need) setTimeout(donePicking,800);
}

function donePicking(){
  deck.classList.add('done','gone');
  revealBtn.classList.add('show');
  say('카드가 모두 당신을 선택했어요.\n이제 운명을 확인해 볼까요?');
}

revealBtn.addEventListener('click', async ()=>{
  if(body.dataset.phase!=='pick') return;
  revealBtn.classList.remove('show');
  body.dataset.phase='reveal';
  say('카드가 이야기를 시작합니다…');
  const slots=[...slotsEl.children];
  for(const s of slots){ s.classList.add('flipped'); await wait(650); }
  await wait(1300);
  // 위쪽 카드 줄은 접고, 카드+설명을 한 화면에 함께 보여줌
  slotsEl.classList.add('leave');
  await wait(500);
  body.dataset.phase='result';
  slotsEl.classList.remove('leave');
  buildReading();
  track('reveal',{topic:state.topic, cards:state.picked.map(p=>CARDS[p.card].en+(p.rev?' (R)':'')).join(', ')});
  reading.classList.add('show');
  window.scrollTo({top:0,behavior:'smooth'});
  say('카드가 전하는 이야기를 천천히 읽어보세요.');
});

function buildReading(){
  const T=TOPICS[state.topic], isLove=state.topic==='love';
  let html='';
  if(state.question) html+=`<p class="r-q">당신의 질문 · <b>${esc(state.question)}</b></p>`;
  const three=state.picked.length===3;
  html+=`<div class="r-list${three?' three':''}">`;
  state.picked.forEach((p,i)=>{
    const c=CARDS[p.card];
    const text = isLove ? (p.rev?c.loveR:c.love) : (p.rev?c.rev:c.up);
    const kws = p.rev?c.rkw:c.kw;
    html+=`<article class="r-item" style="animation-delay:${i*.15}s">
      <div class="r-card">${frontHTML(p.card,p.rev)}</div>
      <div class="r-body">
        <div class="r-pos">${T.pos[i]}</div>
        <h3>${c.n}. ${c.ko} <span class="ori ${p.rev?'dn':'up'}">${p.rev?'역방향':'정방향'}</span></h3>
        <div class="chips">${kws.map(k=>`<span>${k}</span>`).join('')}</div>
        <p>${text}</p>
        <p class="adv">✦ ${c.adv}</p>
      </div></article>`;
  });
  html+='</div>';
  const n=state.picked.length, ups=state.picked.filter(p=>!p.rev).length;
  const mood = ups===n ? '카드가 모두 바로 서 있어요. 흐름이 순조롭고, 당신의 기운이 밝게 열려 있습니다.'
    : ups===0 ? '카드가 모두 거꾸로 놓였어요. 역방향은 나쁜 운명이 아니라, 잠시 멈춰 방향을 다시 잡으라는 신호예요.'
    : ups>n/2 ? '대체로 밝은 흐름 속에, 살펴봐야 할 부분이 하나 숨어 있어요.'
    : '조심스럽게 풀어가야 할 흐름이에요. 거꾸로 선 카드가 알려주는 부분을 먼저 다독여 주세요.';
  const last=CARDS[state.picked[n-1].card];
  html+=`<div class="summary" style="animation:rise .8s ${n*.15+.1}s both">
    <h4>✦ MASTER'S WORD ✦</h4>
    <p>${state.question?`「${esc(state.question)}」에 대한 카드의 대답이에요. `:''}${T.lead}</p><p>${mood}</p>
    <p>마지막으로 「${last.ko}」 카드가 이렇게 속삭여요.<br><b style="color:var(--gold-hi)">“${last.adv}”</b></p>
  </div>
  <p class="note">타로는 마음을 비추는 거울일 뿐, 선택은 언제나 당신의 몫이에요.</p>
  <div class="actions"><button class="btn" id="againBtn">다시 보기</button></div>`;
  reading.innerHTML=html;
  reading.classList.toggle('three',three);
  $('#againBtn').addEventListener('click',()=>{
    track('restart',{topic:state.topic});
    reading.className=''; reading.innerHTML=''; slotsEl.innerHTML=''; deck.innerHTML='';
    window.scrollTo({top:0,behavior:'smooth'}); intro();
  });
}

/* ================= 밤하늘 캔버스 ================= */
(function sky(){
  const cv=$('#sky'), ctx=cv.getContext('2d');
  let W,H,dpr,stars=[],dust=[],shoot=null;
  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(W*H/5000);
    stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,p:Math.random()*6.28,s:Math.random()*.02+.005}));
    dust=Array.from({length:Math.round(n/5)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.6,v:Math.random()*.25+.08,p:Math.random()*6.28}));
  }
  addEventListener('resize',resize); resize();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ s.p+=s.s; const a=.35+.65*Math.abs(Math.sin(s.p));
      ctx.fillStyle=`rgba(255,250,235,${a})`; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill(); }
    for(const d of dust){ d.y-=d.v; d.p+=.02; d.x+=Math.sin(d.p)*.25; if(d.y<-5){d.y=H+5;d.x=Math.random()*W}
      const g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*4);
      g.addColorStop(0,'rgba(233,201,124,.75)'); g.addColorStop(1,'rgba(233,201,124,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(d.x,d.y,d.r*4,0,6.28); ctx.fill(); }
    if(!shoot && Math.random()<.004) shoot={x:Math.random()*W*.8+W*.2,y:Math.random()*H*.4,l:0};
    if(shoot){ shoot.l+=1; const t=shoot.l, x=shoot.x-t*9, y=shoot.y+t*4;
      const g=ctx.createLinearGradient(x,y,x+90,y-40); g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+90,y-40); ctx.stroke();
      if(t>45) shoot=null; }
    if(!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

intro();
</script>
